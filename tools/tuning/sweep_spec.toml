# ══════════════════════════════════════════════════════════════════════════
#  TREE CALIBRATION (2026-07-25)
#
#  Architecture changed since the round-2 DAG sweep: cross-linking is removed
#  (commit 334b95d), so the base is the tree canonical — seed 42 gives
#  J=0.26697, 177 nodes / 112 leaves, converged, multi_leaf_rate=0.1518,
#  held-out Top-1 73.72% [72.25, 75.13].
#
#  Every bridge factor and gate from the previous spec is gone: they are
#  vacuously satisfied on a tree and would have silently passed everything.
#  The four factors below are the knobs that still do something:
#
#   - proposalSeparationBar {0.01, 0.02, 0.03}
#       The structure knob. Chance-corrected separation floor for splits.
#       Null-calibrated ceiling was ~0.014-0.021 (measured p95 for n>=150),
#       so this brackets the noise line rather than straddling it blindly.
#
#   - descentMargin {0.06, 0.12, 0.18}
#       Slack below the Jensen-tight descent bar: trades residual rate
#       against leaf purity. Canonical 0.12 came from the DAG sweep and has
#       never been re-checked under a tree.
#
#   - minClusterSize {25, 30, 35}
#       Leaf granularity. Hard constraint downstream: the arena needs >=12
#       held-out top-1 per leaf, so watch per-leaf support, not just count.
#
#   - membershipFloor {0.15, 0.25, 0.35}
#       Min share of a query's own membership for a leaf to count — the
#       direct control on multi_leaf_rate, which is now a headline claim
#       ("soft multi-membership over a strict hierarchy"), so it must be
#       calibrated rather than inherited.
#
#  routingBeamGamma is held at the canonical 0.20: it and membershipFloor
#  both act on multi-membership, and L9 cannot separate their interaction.
#  Sweep it in a follow-up if membershipFloor turns out to be at an edge.
# ══════════════════════════════════════════════════════════════════════════

[factors]
proposalSeparationBar = [0.01, 0.02, 0.03]
descentMargin         = [0.06, 0.12, 0.18]
minClusterSize        = [25, 30, 35]
membershipFloor       = [0.15, 0.25, 0.35]

[gates.hard]
Acyclic = true
OrphanCount = 0
MaxAssignmentCapRate_le = 0.20
SmallLeafFraction_le = 0.50

[gates.soft]
AvgMatchCount_band = [1.0, 4.0]
Top1Accuracy_ge = 0.72
RoutingECE_le = 0.30
CrossAnchorMigrationRate_band = [0.10, 0.30]
CanonicalAdaptedJaccard_band = [0.0, 1.0]
