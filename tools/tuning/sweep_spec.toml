# ══════════════════════════════════════════════════════════════════════════
#  CALIBRATION SWEEP — PROPOSAL-GATED POLYHIERARCHY REGIME (2026-07-23)
#
#  Base: cross-linking restored as a J-gated growth edit; split gate is a
#  pure Delta-J > 0 veto (local chance-corrected separation gates quality);
#  fusion redirects preserve edge type; descentMargin wired into the
#  Jensen-tight descent gate.
#
#  FACTORS (all wired end-to-end in the current code):
#
#   - descentMargin {0.0, 0.02, 0.05}
#       Slack below the Jensen-tight descent bar
#       max_c<mu_c,x> >= (r_bar_p - d) * <mu_p,x>.
#       0.0 = exact bound (max residuals, max cross-link fuel);
#       0.05 = measured single-run endpoint: residuals -38% but purity
#       -1.9pts and bridges 11 -> 4. The sweep decides where the knee is.
#
#   - minClusterSize {25, 50, 75}
#       Granularity dial: leaf count vs SmallLeafFraction/starvation.
#
#   - secondaryMassFloor {2.0, 5.0, 10.0}
#       Cross-link host/candidate support floor: 2.0 admits tiny re-firing
#       proposals; higher prunes proposal noise but may starve genuine links.
#
#   - routingBeamGamma {0.015, 0.05, 0.10}
#       Additive cosine beam margin below best sibling: sharing breadth,
#       drives multi-assignment rate and ECE.
#
#  Interaction under test: descentMargin vs bridge formation — residual
#  pools are the cross-link generator's fuel, so loosening the gate may
#  trade measured ambiguity (residuals) for lost polyhierarchy (bridges).
# ══════════════════════════════════════════════════════════════════════════

[factors]
descentMargin      = [0.0, 0.02, 0.05]
minClusterSize     = [25, 50, 75]
secondaryMassFloor = [2.0, 5.0, 10.0]
routingBeamGamma   = [0.015, 0.05, 0.10]

[gates.hard]
Acyclic = true
DuplicateBridgeCount = 0
OrphanCount = 0
has_depth2_sourceB = false
MaxAssignmentCapRate_le = 0.20
SmallLeafFraction_le = 0.50
SelectedNodeStarvedLeafFraction_le = 0.20
SourceBPerAnchorMean_le = 3.0

[gates.soft]
AvgMatchCount_band = [1.0, 4.0]
Top1Accuracy_ge = 0.72
RoutingECE_le = 0.30
CrossAnchorMigrationRate_band = [0.10, 0.30]
CanonicalAdaptedJaccard_band = [0.0, 1.0]