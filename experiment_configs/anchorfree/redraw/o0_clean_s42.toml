# ANCHOR-FREE-REDRAW arm R1c o0_clean_s42: the ANCHORED same-code control on the CLEAN split.
# BASE experiment_configs/h9_order/o0_s42.toml (seed-42 unshuffled anchored control; its header is
# not reproduced here because its `pool_guard.py --activate` line is stale: nothing is activated).
# ONE KEY: reservedPoolFile = experiment_configs/reserved_pool_frozen_p2dca.json, the same file as R1.
# The optional `pool` line beside it is the [POOL-PIN] guard the registration allows (a guard, not a
# treatment). Gives "16 vs 5" (ANCHOR-FREE) its clean-split instance: C6 = R1 certifies >= R1c + 8.
#
# REGISTRATION. docs/judge_v2_program.md, "Registered 2026-09-17 (before running) - ANCHOR-FREE-REDRAW"
# (commit d61f2cf; plan docs/agents/plans/2026-09-17_anchor_free_redraw.md). Zero judge calls.
# Every arm = its BASE with exactly ONE treatment key on an active key line (never inside a
# header comment: commit 92009dc), its own outputDir under experiment_results/anchorfree/redraw/
# and its own -Dranking.db.path (experiment_results/anchorfree/redraw/ratings_<arm>.db, set by
# tools/chains/anchor_free_redraw.sh). Label-free, z 2.0, mcs 55, 256-dim slice, bar 0.025.
# Nothing is activated (pool_guard --activate no longer exists, 2026-09-16); verify the pool of
# record with `python tools/analysis/pool_guard.py --pool p2dca21ab5f4ef3ae`. The tree this
# builds is STRUCTURAL EVIDENCE ONLY; the registration does NOT authorise judging on it.
# Instrument: 300-rep site null at the build's slice (256, dropTop 0, whiten false),
# anchor_free_readout.py vs experiment_results/anchorfree/af/seed_42 with
# site_null_af_s42.csv as control, then tools/analysis/anchor_free_redraw.py.
# Order in the sweep: R1, R1c, R2, R3, R4; all five run regardless (no early stopping).
#
datasetType   = "MMLU_PRO"

models        = [
    "gpt-4o-2024-08-06",
    "claude-3-5-sonnet-20241022",
    "gemini-1.5-pro-002",
    "deepseek-chat-v2_5",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "gpt-4o-mini",
    "claude-3-5-haiku-20241022",
    "Mixtral-8x7B-Instruct-v0.1",
    "c4ai-command-r-v01",
    "Qwen1.5-14B-Chat",
    "Meta-Llama-3_1-8B-Instruct",
    "gemini-1.5-flash-002",
    "Llama-2-70b-hf",
    "Llama-2-13b-hf"
]

category      = ""
queryLimit    = 0
outputDir     = "experiment_results/anchorfree/redraw/o0_clean_s42"
testRatio     = 0.3
seed          = 42
reservedPoolFile = "experiment_configs/reserved_pool_frozen_p2dca.json"
pool             = "p2dca21ab5f4ef3ae"   # [POOL-PIN] guard, not a treatment (registration: allowed beside reservedPoolFile)

# Body = h9_seed137.toml with seed = 42 (the frozen build's split and construction seed)
# and its outputDir. CONTROL: constructionOrderShuffleSeed is deliberately ABSENT here
# (null = no shuffle = the production order); o1-o3 differ from this file only by that key.

runPipeline        = true
runBenchmark       = false
runTrickle         = true
runBaselines       = false
enableFinalMetrics = false
enableLabeling     = false
judgeInduction     = false

dagMode = "DAG_MAX"

maxDepth              = 8
minClusterSize        = 55
proposalSeparationBar = 0.025
tau                   = 1e-6
acceptanceZ           = 2.0
enableRefitGate       = false

membershipFloor       = 0.25
routingBeamGamma      = 0.2
descentMargin         = 0.12

effectiveSupportFloor = 2.0
defaultKappaPrior     = 10.0

numIterations         = 50
maxLeafAssignments    = 5

fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false

enableProfiling           = true
