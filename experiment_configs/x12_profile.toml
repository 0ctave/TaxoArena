# PROFILE-MODE CAPABILITY ATLAS (R2) — 12 models x 20 embedding strata, PRE-REGISTERED.
#
# WHY THIS RUN EXISTS (2026-09-06). Three pre-registered runs established that arena
# verdicts carry the model x domain interaction (p = 0.003, 0.003, 0.001), but every
# one of them sampled under DECISION-mode stopping, which retires pairs the moment
# their order is pinned. That design measurably starves the margins: the x8 per-pair
# registration died of it, and in x12 the three strongest models' domain deltas
# collapsed or flipped against ground truth exactly where tie-heavy rank-adjacent
# sampling compresses differences (the grok second-judge pass independently located
# the same tie-boundary divergence in the same region). This run switches the
# stopping question from "is the order decided?" to "is every strength MEASURED?":
# sample until SE(theta_{model, stratum}) <= 0.15 logits for every model in every
# stratum, or the stratum's pool is exhausted.
#
# STRATA: experiment_configs/strata_profile_v1.json — 20 strata over the 87 leaves,
# derived DETERMINISTICALLY from the frozen snapshot's per-leaf vMF embedding means
# (average-linkage within anchor; a 2-way split is accepted iff both halves hold
# >= 100 reserved questions; tie-breaks by node id — tools/analysis/build_profile_strata.py).
# Six anchors split, and the splits are semantically real: micro vs macro economics,
# classical vs quantum chemistry, continuous vs discrete mathematics, thermal vs
# electrical engineering — "sub-domains identified from the embedding separation",
# frozen before any profile verdict existed.
#
# MECHANICS PILOT (profile_pilot_business.toml, 2026-09-06): Business only, SE 0.30,
# 825 matches, converged and self-stopped in 6 rounds. DISCLOSURE: that pilot showed
# the Business strata's contrasts at noise-level precision before this registration
# was frozen; Business therefore adjudicates NOTHING below (its contrasts are
# reported as disclosed descriptives). All adjudicating contrasts are on anchors the
# pilot never touched.
#
# REGISTRATION, frozen here before the run starts. The test is DEFINED BY
# tools/analysis/profile_atlas.py as committed alongside this config, run UNCHANGED
# on this run's database:
#
#   PRIMARY: pooled within-anchor interaction LRT over the six split anchors
#   (per-stratum Bradley-Terry against pooled-anchor Bradley-Terry, ties
#   half-weighted, Jeffreys 0.5, likelihood on raw counts; permutation null =
#   stratum labels shuffled within (anchor, pair), NPERM = 1000, seed 42).
#
#   DIRECTIONAL, centered contrasts (model delta minus roster-mean delta), GT
#   reserved-set predictions in brackets:
#     (2) chemistry-1 - chemistry-2: gemini-3.1-pro_5-shots > 0   [GT +0.68]
#     (3) chemistry-1 - chemistry-2: Meta-Llama-3_1-8B      < 0   [GT -0.66]
#     (4) economics-1 - economics-2: Meta-Llama-3_1-70B-Instruct > 0 [GT +0.50]
#     (5) math-1 - math-2:           arx_0314               > 0   [GT +0.41]
#
#   CONFIRMED if (1) p_perm < 0.05 and all four signs hold. Any other pattern is
#   reported as-is; (1) alone is "sub-domain interaction present, direction pattern
#   unconfirmed". No other test on this run's data adjudicates the claim.
#
#   REGISTERED QUESTION (two-sided, decides nothing, both outcomes informative):
#   under SE-targeted depth, do iask_pro / gemini / gpt-4o recover their
#   GT-direction math-vs-law+psychology deltas (indicting decision-mode tie
#   compression for the x12 collapse), or does the divergence persist (indicting
#   the judge's view of top-tier reasoning)?
#
# POST-FREEZE DISCLOSURE (2026-09-06, before launch): an exploratory stratum-level
# look at the EXISTING x12 decision-mode data was taken (per-stratum MM fits, no
# permutation test). It showed the Economics registered contrast already positive
# (L3.1-70B +0.66) and the top-tier contrasts attenuated or flipped (gemini
# chemistry -0.32 vs GT +0.68; arx math +0.09 vs GT +0.41), consistent with the
# tie-compression hypothesis this run tests. The frozen criteria above are
# unchanged; adjudication remains solely profile_atlas.py on THIS run's database.
#
# DESIGN. Whole reserved pool over all 87 cells, 12-model x12 roster, MAIN/RESOLVED,
# profile stopping at SE 0.15. Expected scale ~30-35k matches (~60-70k judge calls,
# ~7-8 h at 32 permits / 3.0 rps), calibrated from the pilot's realized information
# of ~0.16 per comparison. resumeBenchmark is ON: a crash is recovered by
# relaunching the same command; verified to re-judge only missing slots.
#
# Launch: set -a; source <(tr -d '\r' < .env); set +a; \
#   ./gradlew.bat bootRun --rerun-tasks \
#     -Dranking.db.path=experiment_results/x12_profile/ratings_x12p.db \
#     --args="--config experiment_configs/x12_profile.toml"
# AFTER the run (and any resume): restore
# frozen_triples_20260727_042523_Headless_Run_Auto_ge_MAIN.json from HEAD.
#
# IMPLEMENTATION INCIDENT (2026-09-06, disclosed; criteria unchanged). The first
# launch ended after round 38 (9,235 verdicts) with ZERO strata at target: the
# scheduler's selectTargetNodes called isLeafConverged without the condition
# argument, fell into the LEGACY_MAIN decision-mode branch, and retired every leaf
# on order-pinned criteria — exactly the stopping behavior this run exists to turn
# off. Fixed by passing the condition through (profile runs only; decision-mode
# target selection is bit-identical to the settled runs), regression-tested, and
# the run RESUMED on the same database: all 9,235 paid verdicts reconstruct, and
# sampling continues toward the registered SE 0.15 / pool-exhaustion stop. The
# frozen analysis and criteria above are untouched by the fix.
#
# ── OUTCOME (2026-09-07, run 18:48–03:21 incl. the disclosed round-38 incident and
# resume: 36,871 verdicts, 146 rounds, ALL 20 strata at SE <= 0.150) ──
#
# Analysis: profile_atlas.py run UNCHANGED (exit 0, output archived at
# experiment_results/x12_profile/atlas_output.txt).
#
# PRIMARY (1): LRT = 60.24 against null median -30.29 / p95 -16.34 -> p_perm = 0.001.
# Sub-domain interaction PRESENT at measurement-grade depth.
#
# DIRECTIONAL CONTRASTS: 2 of 4 registered signs correct —
#   Chemistry  L3.1-8B   pred -  got -0.250 (SE 0.192)  OK
#   Math       arx_0314  pred +  got +0.202 (SE 0.192)  OK
#   Chemistry  gemini    pred +  got -0.216 (SE 0.171)  WRONG SIGN
#   Economics  L3.1-70B  pred +  got -0.091 (SE 0.221)  WRONG SIGN (within noise of 0)
# Per the frozen criteria this is NOT "CONFIRMED"; the registered fallback wording
# applies: SUB-DOMAIN INTERACTION PRESENT, DIRECTION PATTERN UNCONFIRMED.
# Disclosed Business descriptives (non-adjudicating, pilot-seen): 2 of 3 signs OK.
#
# REGISTERED TWO-SIDED QUESTION — ANSWERED, second arm: the top-cluster divergence
# PERSISTS under SE-targeted depth. delta(math - law/psych): gemini -0.401 (GT +1.18),
# gpt-4o -0.274 (GT +0.57), iask_pro +0.005 (GT +1.31) — essentially the x12
# decision-mode values reproduced with 4x the data and guaranteed margins. Decision-
# mode tie compression is thereby REJECTED as the explanation for the x12 anomaly:
# the divergence is a stable property of the judge's view of frontier-tier outputs,
# not of the sampling design. (The R3 cross-family pass showed grok agrees with
# Mistral at 97.8% on these matches, so it is not one judge family's quirk either.)
# Mid/low-tier replications hold: arx +0.438, deepseek +0.803, L2-7b -0.523,
# L2-13b -0.552 — fourth independent dataset, same signs.
#
# POST-HOC ROBUSTNESS (2026-09-07, disclosed): matches sharing a question are
# correlated (measured query-level design effect: median 2.0x, worst 3.7x across
# strata), and the registered permutation shuffles at match level. A cluster-
# respecting question-level permutation (tools/analysis/atlas_question_perm.py,
# same LRT/fits/NPERM/seed) widens the null as expected (p95 -16.3 -> +24.8) and
# the primary still clears it: p_perm = 0.002. Honest query-level SEs run
# 0.14-0.245 against the 0.15 match-level target; the top-cluster divergence
# (gaps 1.2-1.6 logits) remains ~5 sigma under either SE. Output archived at
# experiment_results/x12_profile/question_perm_robustness.txt.
#
# READING, stated plainly: arena verdicts carry real sub-domain structure (p=0.001,
# fourth consecutive run), and per-model direction predictions from the GT screen
# replicate for mid- and low-tier models. Where GT and judge disagree — top-tier
# models' domain tilts — the disagreement survives every design change tried, which
# relocates the open question from the arena's sampling to the relationship between
# preference-based and key-based measurement at the frontier tier.
#
# MAIN ONLY, NOT a thesis result: the settled batch stands as published.
#
datasetType   = "MMLU_PRO"
models        = [
    "gemini-3.1-pro_5-shots",
    "arx_0314",
    "gpt-4o-2024-08-06",
    "iask_pro",
    "deepseek-chat-v2_5",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "c4ai-command-r-v01",
    "Meta-Llama-3_1-8B",
    "Yi-6b-Chat",
    "Llama-2-13b-hf",
    "Llama-2-7b-hf"
]
snapshotId    = "20260727_042523_Headless_Run_Auto_ge"
# category deliberately ABSENT: the whole reserved pool routes, across every domain's cells.
queryLimit    = 0
outputDir     = "experiment_results/x12_profile"
testRatio     = 0.3
seed          = 45

runPipeline        = false
regenerateSplit    = false   # load-bearing: use the canonical reserved pool as-is
runBenchmark       = true
runTrickle         = false
runBaselines       = false
enableFinalMetrics = false
enableLabeling     = false
judgeInduction     = false

conditions         = ["MAIN"]
resumeBenchmark    = true
profileMode        = true
profileSeTarget    = 0.15
profileStrataFile  = "experiment_configs/strata_profile_v1.json"
questionsPerRound  = 250
confidenceGate     = 0.0
parallelism        = 4
reservedOnly       = true

dagMode = "DAG_MAX"
maxDepth              = 8
minClusterSize        = 55
proposalSeparationBar = 0.025

judgeOptionMode = "RESOLVED"
