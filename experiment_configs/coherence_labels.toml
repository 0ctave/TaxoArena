# ══════════════════════════════════════════════════════════════════════════
#  outputDir: experiment_results/coherence_labels
#  coherence_labels.toml — CONFIG A: do the leaves mean anything?
#
#  Nobody has read a leaf. enableLabeling has been false in every config in this
#  project, so the taxonomy's cells have never been named, and "the construction
#  converges and conserves mass" has never been joined to "the partition is
#  semantically coherent". This is the cheapest decisive check available and it
#  has been deferred repeatedly.
#
#  Identical to canonical_baseline.toml except:
#    enableLabeling = true    the point of the run
#    runBenchmark   = false   no judge calls; this is not an arena run
#    runBaselines   = false   WARD is broken (8.47% ~ chance, scoring-path bug)
#                             and k-means is already measured canonically
#    judgeInduction = false   rubrics are an arena concern
#
#  ── Why labeling is an Azure cost, not a local one ────────────────────────
#  taxoadapt.llm.provider = AZURE routes EVERY LLM call through Azure including
#  labeling; labeling-model is Mistral-Large-3. Ollama serves only the embedding
#  model. So this is ~1 call per node, not free.
#
#  ── The known hazard ──────────────────────────────────────────────────────
#  The LLM post-pass runs AFTER construction but BEFORE the validation exports,
#  so a labeling failure destroys the run's metrics -- this happened 2026-07-25
#  and is why enableLabeling was turned off for the calibration sets. Accepted
#  here because labels ARE the deliverable; if it dies, the construction numbers
#  are already available from canonical_baseline and nothing is lost but time.
#
#  ── What to read when it lands ────────────────────────────────────────────
#  Ten labels, and specifically the largest and smallest leaves. A 400-query leaf
#  labelling as "organic reaction mechanisms" means the coarseness is real
#  structure; labelling as "general chemistry" means it is undersplit. Pair each
#  with its [NO-SPLIT] reason, which now carries the binding value:
#     sep_below_bar(sep=0.00400,bar=0.02500,k=3)   -> atomic
#     sep_below_bar(sep=0.02300,bar=0.02500,k=3)   -> near-miss at the bar
#  Both are in diagnostics/proposals.csv as of 85ced87, so this is a GROUP BY
#  rather than a log read.
#
#  NOTE ON GRANULARITY: the 104-leaf, 4x queries-per-leaf figures come from the
#  PRE-repair corpus, which carried 481 duplicate questions and was missing 51%
#  of engineering. The post-repair canonical rerun gives 88 leaves at J = 0.2294.
#  Recompute the per-domain table from THIS run, not from the old one.
# ══════════════════════════════════════════════════════════════════════════

datasetType   = "MMLU_PRO"

models        = [
    "gpt-4o-2024-08-06",
    "claude-3-5-sonnet-20241022",
    "gemini-1.5-pro-002",
    "deepseek-chat-v2_5",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "gpt-4o-mini",
    "claude-3-5-haiku-20241022",
    "Mixtral-8x7B-Instruct-v0.1",
    "c4ai-command-r-v01",
    "Qwen1.5-14B-Chat",
    "Meta-Llama-3_1-8B-Instruct",
    "gemini-1.5-flash-002",
    "Llama-2-70b-hf",
    "Llama-2-13b-hf"
]

category      = ""      # all 14 domains
queryLimit    = 0
outputDir     = "experiment_results/coherence_labels"
testRatio     = 0.3
seed          = 42

# ── Pipeline switches ───────────────────────────────────────────────────────
runPipeline        = true
runBenchmark       = false         # no arena, no judge calls
runTrickle         = true          # keeps the routing/ECE exports
runBaselines       = false
enableFinalMetrics = true
enableLabeling     = true          # THE POINT OF THIS RUN
judgeInduction     = false

# ── Construction mode ───────────────────────────────────────────────────────
dagMode = "DAG_MAX"

# ── Formalism: canonical, unchanged ─────────────────────────────────────────
maxDepth              = 8
minClusterSize        = 30
proposalSeparationBar = 0.025
tau                   = 1e-6
acceptanceZ           = 0.0
enableRefitGate       = false

membershipFloor       = 0.25
routingBeamGamma      = 0.2
descentMargin         = 0.12

effectiveSupportFloor = 2.0
defaultKappaPrior     = 10.0

numIterations         = 50
maxLeafAssignments    = 5

fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false

enableProfiling           = true
