# HYGIENE replica (registered 2026-09-10): the promoted bareq512_s42 config with labeling and rubric induction OFF. The DAG must be byte-identical to the promoted (labeled) build — labeling is a post-pass and must not touch structure.
# PROMOTED construction bareq512_s42 (2026-09-09): the frozen mcs=55 recipe (labeling + judge induction ON,
# seed 42) at the D2-winning geometry, on the FROZEN split (reservedPoolFile -> reserved pool
# p2dca21ab5f4ef3ae). Structural evidence: docs/v2_validation_plan.md D1/D2. Arena-ready.
datasetType   = "MMLU_PRO"

models        = [
    "gpt-4o-2024-08-06",
    "claude-3-5-sonnet-20241022",
    "gemini-1.5-pro-002",
    "deepseek-chat-v2_5",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "gpt-4o-mini",
    "claude-3-5-haiku-20241022",
    "Mixtral-8x7B-Instruct-v0.1",
    "c4ai-command-r-v01",
    "Qwen1.5-14B-Chat",
    "Meta-Llama-3_1-8B-Instruct",
    "gemini-1.5-flash-002",
    "Llama-2-70b-hf",
    "Llama-2-13b-hf"
]

category      = ""
queryLimit    = 0
outputDir     = "experiment_results/hygiene/bareq512_s42_labelfree7"
testRatio     = 0.3
seed          = 42
reservedPoolFile = "experiment_configs/reserved_pool_frozen_p2dca.json"   # the pool of record, by id; seeds do not reproduce it (incident 2026-09-09)

runPipeline        = true
runBenchmark       = false
runTrickle         = true
runBaselines       = false
enableFinalMetrics = true
enableLabeling     = false
judgeInduction     = false

dagMode = "DAG_MAX"

maxDepth              = 8
minClusterSize        = 55
proposalSeparationBar = 0.0145
tau                   = 1e-6
acceptanceZ           = 2.0
enableRefitGate       = false

membershipFloor       = 0.25
routingBeamGamma      = 0.2
descentMargin         = 0.12

effectiveSupportFloor = 2.0
defaultKappaPrior     = 10.0

numIterations         = 50
maxLeafAssignments    = 5

fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false

enableProfiling           = true

# -- geometry (D1/D2 keys) --
embeddingSliceDim = 512
splitDropTopPcs   = 0
splitWhiten       = false
