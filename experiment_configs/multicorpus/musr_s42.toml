# MULTI-CORPUS STAGE 1b — FEDERATED construction (docs/multi_corpus_design.md, "Stage 1 certification
# result ... design adjustment"): MUSR built ALONE with its own loop, split and site null. Body =
# mc6_s42 (promoted bareq512 construction: mcs 55, bar 0.0145, z 2.0, slice 512, testRatio 0.30, seed 42),
# the only change being corpora = ["MUSR"]. Depth-1 anchors = 3 MuSR tasks.
# Label-free, zero judge calls; the union is assembled afterwards by grafting this snapshot's root under
# a union root (unionSnapshots key). Roster = the 18 leaderboard models the multi-corpus DB holds.
corpora      = ["MUSR"]
corpusDbPath = "multicorpus_cache_v1.db"

models        = [
    "DeepSeek-R1-Distill-Llama-8B",
    "DeepSeek-R1-Distill-Qwen-32B",
    "Falcon3-10B-Instruct",
    "Llama-3.1-70B-Instruct",
    "Llama-3.2-3B-Instruct",
    "Llama-3.3-70B-Instruct",
    "Mistral-Small-Instruct-2409",
    "Mixtral-8x7B-Instruct-v0.1",
    "OLMo-2-1124-7B-Instruct",
    "Phi-3.5-mini-instruct",
    "Qwen2.5-32B-Instruct",
    "Qwen2.5-72B-Instruct",
    "Qwen2.5-7B-Instruct",
    "Qwen2.5-Coder-7B-Instruct",
    "Qwen2.5-Math-7B-Instruct",
    "Yi-1.5-34B-Chat-16K",
    "c4ai-command-r-plus-08-2024",
    "internlm2_5-20b-chat"
]

category      = ""
queryLimit    = 0
outputDir     = "experiment_results/multicorpus/musr_s42"
testRatio     = 0.30
seed          = 42

runPipeline        = true
runBenchmark       = false
runTrickle         = true
runBaselines       = false
enableFinalMetrics = true
enableLabeling     = false
judgeInduction     = false

dagMode = "DAG_MAX"

maxDepth              = 8
minClusterSize        = 55
proposalSeparationBar = 0.0145
tau                   = 1e-6
acceptanceZ           = 2.0
enableRefitGate       = false

membershipFloor       = 0.25
routingBeamGamma      = 0.2
descentMargin         = 0.12

effectiveSupportFloor = 2.0
defaultKappaPrior     = 10.0

numIterations         = 50
maxLeafAssignments    = 5

fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false

enableProfiling           = true

# -- geometry (D1/D2 keys) --
embeddingSliceDim = 512
splitDropTopPcs   = 0
splitWhiten       = false
