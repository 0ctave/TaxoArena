# ══════════════════════════════════════════════════════════════════════════
#  outputDir: experiment_results/bar070
#  mcs30_eps02_tree_treefix.toml — SINGLE-CHANGE VERIFICATION RUN
#
#  Parameter-identical to the canonical `mcs30_eps02_tree.toml`. The ONLY
#  difference is outputDir, so the run is attributable to the code change
#  alone: the redundant-fusion pass is now restricted to pairs that share a
#  parent (TaxonomyMerger.isTreeLegalFusionPair), which removes the last
#  operator able to create multi-parent nodes.
#
#  WHY: the canonical run is not actually a strict tree. Its
#  validation/MAIN_graph_validity.csv reports BridgeCount=1 — a node with two
#  parents, produced by fuseNodes redirecting a source's parent edge onto a
#  survivor that already had one. No bridge selector was involved
#  (JsDivergence=0), and cross-linking was already deleted.
#
#  REFERENCE (canonical, experiment_results/mcs30_eps02_tree/seed_42):
#    BridgeCount           1        <- must become 0
#    J                     0.26696
#    TotalNodes            177      (DepthDistribution 0:1;1:14;2:42;3:77;4:43)
#    LeafCount             112
#    OrphanCount           0
#    ResidualCount         0
#    structural fixed point  iteration 6, convergence declared 15
#    multi_leaf_rate       0.1518
#    held-out Top-1        73.72% [72.25, 75.13]
#
#  PASS/FAIL:
#    HARD  — BridgeCount = 0, Acyclic = true, OrphanCount = 0.
#    WATCH — J, node/leaf counts and Top-1 against the reference above. The
#            suppressed fusion means one merge no longer happens, so a small
#            topology difference is expected and is the thing being measured.
#            A large J drop would say the cross-parent fusion was doing real
#            work and the fix needs discussion rather than acceptance.
#
#  Compare with:
#    experiment_results/mcs30_eps02_tree_treefix/seed_42/validation/MAIN_graph_validity.csv
#    experiment_results/mcs30_eps02_tree/seed_42/validation/MAIN_graph_validity.csv
# ══════════════════════════════════════════════════════════════════════════

datasetType   = "MMLU_PRO"

# Evaluated model roster (16 models spanning capability tiers, frontier -> small).
# Held fixed across all conditions; the arena ranks these within each leaf.
models        = [
    "gpt-4o-2024-08-06",
    "claude-3-5-sonnet-20241022",
    "gemini-1.5-pro-002",
    "deepseek-chat-v2_5",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "gpt-4o-mini",
    "claude-3-5-haiku-20241022",
    "Mixtral-8x7B-Instruct-v0.1",
    "c4ai-command-r-v01",
    "Qwen1.5-14B-Chat",
    "Meta-Llama-3_1-8B-Instruct",
    "gemini-1.5-flash-002",
    "Llama-2-70b-hf",
    "Llama-2-13b-hf",
    "Meta-Llama-3-70B-Instruct"
]

category      = ""      # "" = all 14 MMLU-Pro domains (empty = no category filter)
queryLimit    = 0       # 0 = no cap; use the full corpus
outputDir     = "experiment_results/bar070"
testRatio     = 0.3     # frozen 70/30 stratified split; the 30% held-out pool is
                        # reserved for arena evaluation and excluded from construction
seed          = 42      # construction seed

# ── Pipeline / evaluation switches ──────────────────────────────────────────
runPipeline        = true
runBenchmark       = false
runTrickle         = true          # needed — produces the ECE/routing metrics
runBaselines       = false         # matches canonical; baselines belong to cal_seeds
enableFinalMetrics = true          # REQUIRED — you need metrics to validate
enableLabeling     = false        # probe: LLM labeling off (does not affect topology/metrics)
judgeInduction     = false         # judges are induced in the arena step

# ── Construction mode ───────────────────────────────────────────────────────
dagMode = "DAG_MAX"      # keeps residualRouting / residualSplitGate / stableQuestionIds on.
                         # Cross-linking no longer exists, so this is purely those three flags.

# ── Formalism parameters ─────────────────────────────────────────────────────
maxDepth              = 8      # max taxonomy depth (caps runaway recursion)
minClusterSize        = 30     # targets >=12 held-out top-1 per leaf to support arena evaluation
proposalSeparationBar     = 0.07   # null-calibration probe
tau                   = 1e-6   # lexicographic J acceptance tolerance

# ── Unified Trickle Routing & Soft-Membership ──────────────────────────────
membershipFloor       = 0.25   # min share of a query's own normalized membership for a leaf to count
routingBeamGamma      = 0.2    # round-2 winner a21f2ac1
descentMargin         = 0.12   # round-2 winner a21f2ac1
                               # higher = fewer residual queries, softer leaf populations (sweep-calibrated)

effectiveSupportFloor = 2.0    # min effective (soft) support for a node to be retained
defaultKappaPrior     = 10.0   # NiW prior concentration when a node has too few points

numIterations         = 50     # max evolution passes
maxLeafAssignments    = 5      # max leaves a single query may be softly assigned to during arena evaluation

# ── Merging / convergence ────────────────────────────────────────────────────
fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false  # skips trickle-based reassignment on iteration 1, keeping bootstrap intact

# ── Diagnostics ──────────────────────────────────────────────────────────────
enableProfiling           = true

