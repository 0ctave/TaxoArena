# CROSS-DOMAIN 8-MODEL ARENA — one Bradley-Terry scale over every domain at once.
#
# WHY THIS RUN EXISTS (2026-08-08). The settled r8 batch runs one domain per config, so each
# domain gets its own BT fit on its own scale and no comparison is ever made between a
# mathematics cell and a psychology cell. Between-cell heterogeneity measured WITHIN a domain
# is indistinguishable from its shuffled null (Cochran's Q/df 0.44 observed against 0.40
# shuffled, median I-squared 0.00, 104 pairs).
#
# But the model x domain interaction is large and already present in THIS roster. Screening
# every candidate's ground-truth accuracy against an additive model + model effect + domain
# effect:
#
#   arx_0314          math +0.90   psychology -0.59   (spread 1.49 logits)
#   Llama-2-7b-hf     law  +0.53   math       -0.71   (spread 1.24)
#   gpt-4o-2024-08-06 math +0.45   engineering-0.22   (spread 0.67)
#   Qwen1.5-72B-Chat  history +0.24 physics   -0.37   (spread 0.61)
#
# The roster's mean spread is 0.76 logits against 0.67 across all 47 candidates, so it is
# ABOVE average on profile diversity. A 1.49-logit swing is roughly 4x the ~0.4 the
# heterogeneity test can detect. The structure is there; the per-domain run design factors it
# out. This run puts every cell on one scale so the interaction can land in a single fit.
#
# PREDICTION, registered here before the run: Cochran's Q/df across cells rises well above its
# shuffled null for pairs involving arx_0314 and Llama-2-7b-hf, driven by mathematics cells
# against law and psychology cells. If Q/df stays near the null with all 87 cells on one
# scale, the interaction is not recoverable by this arena at this evidence depth and
# task-conditional routing has no measured basis in this roster.
#
# MAIN ONLY. C5 exists to contrast the cell-scoped rubric against a generic one, which is a
# different question and doubles the judge spend. Nothing here needs it.
#
# NOT REGISTERED as a thesis result. Exploratory; the settled batch stands as published.
#
datasetType   = "MMLU_PRO"
models        = [
    "gemini-3.1-pro_5-shots",
    "arx_0314",
    "gpt-4o-2024-08-06",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "Meta-Llama-3_1-8B",
    "Yi-6b-Chat",
    "Llama-2-7b-hf"
]
snapshotId    = "20260727_042523_Headless_Run_Auto_ge"
# category deliberately ABSENT: the whole reserved pool routes, across every domain's cells.
queryLimit    = 0
outputDir     = "experiment_results/x8_crossdomain"
testRatio     = 0.3
seed          = 42

runPipeline        = false
regenerateSplit    = false   # load-bearing: use the canonical reserved pool as-is
runBenchmark       = true
runTrickle         = false
runBaselines       = false
enableFinalMetrics = false
enableLabeling     = false   # rubrics already in the snapshot
judgeInduction     = false

conditions         = ["MAIN"]
questionsPerRound  = 1
confidenceGate     = 0.0
parallelism        = 4
reservedOnly       = true

dagMode = "DAG_MAX"
maxDepth              = 8
minClusterSize        = 55
proposalSeparationBar = 0.025

judgeOptionMode = "RESOLVED"
