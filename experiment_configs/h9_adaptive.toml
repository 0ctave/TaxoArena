# H9 ADAPTIVE-BAR TREE — registered EXPLORATION (2026-09-07, committed before launch).
#
# The within-node null band varies per anchor (p95 0.029-0.075, re-derived on the
# frozen artifact at d72bcd6), so no single bar can be honest everywhere. This run
# gates every split AND every fusion at its anchor's own within-node p95
# (experiment_configs/adaptive_bars_p95.json), via taxonomy.operations.barFor —
# the first construction whose every accepted split clears the honest null BY
# CONSTRUCTION. Identical to freeze_mcs55 otherwise (seed 42; labeling/judging/
# final metrics off).
#
# FROZEN EXPECTATIONS (descriptive; deviations reported as-is):
# - leaf count lands well below 87 (the H9 global-bar sweep collapsed to 19-20 at
#   flat 0.045; per-anchor bars are gentler where nulls are low, so expect ~30-55);
# - structure concentrates in the anchors whose splits already cleared their null
#   (Chemistry, Biology, Engineering, Math, Business);
# - held-out Top-1 within or near the 20-seed floor (0.750-0.776);
# - zero cycle-detector fires (create/destroy read the same per-anchor bar).
# STATUS: exploration for a possible v2 instrument; NOT a replacement for the
# frozen artifact; per-anchor bars are not captured in the snapshot's
# EffectiveConfig provenance (disclosed limitation of this exploration).
#
datasetType   = "MMLU_PRO"

models        = [
    "gpt-4o-2024-08-06",
    "claude-3-5-sonnet-20241022",
    "gemini-1.5-pro-002",
    "deepseek-chat-v2_5",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "gpt-4o-mini",
    "claude-3-5-haiku-20241022",
    "Mixtral-8x7B-Instruct-v0.1",
    "c4ai-command-r-v01",
    "Qwen1.5-14B-Chat",
    "Meta-Llama-3_1-8B-Instruct",
    "gemini-1.5-flash-002",
    "Llama-2-70b-hf",
    "Llama-2-13b-hf"
]

category      = ""
queryLimit    = 0
outputDir     = "experiment_results/h9_adaptive"
testRatio     = 0.3
seed          = 42

runPipeline        = true
runBenchmark       = false
runTrickle         = true
runBaselines       = false
enableFinalMetrics = false
enableLabeling     = false
judgeInduction     = false

dagMode = "DAG_MAX"

maxDepth              = 8
minClusterSize        = 55
proposalSeparationBar = 0.025
tau                   = 1e-6
acceptanceZ           = 2.0
enableRefitGate       = false

membershipFloor       = 0.25
routingBeamGamma      = 0.2
descentMargin         = 0.12

effectiveSupportFloor = 2.0
defaultKappaPrior     = 10.0

numIterations         = 50
maxLeafAssignments    = 5

fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false

enableProfiling           = true

adaptiveBarFile = "experiment_configs/adaptive_bars_p95.json"
