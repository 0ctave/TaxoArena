# ==========================================================================
#  zgate_tau_s137.toml - GATE COMPARISON ARM: legacy tau gate (baseline arm for attribution)
#
#  outputDir: experiment_results/zgate/tau_s137
#  acceptanceZ = 0.0   splitSeed = 42 (FIXED)   seed = 137   runBaselines = false
#
#  Design: splitSeed is pinned across every arm and seed so the only thing varying
#  within an arm is the construction seed. That isolates algorithmic variance from
#  sample variance. RESULT: algorithmic variance measured at exactly zero - all three
#  seeds in every arm produced identical taxonomies (leaf SD 0, ARI 1.0000), so the
#  63-104 leaf spread seen across varying splits is entirely sample-driven.
#
#  acceptanceZ = 0 selects the legacy rule (accept iff dJ > tau, tau = 1e-6, with a
#  node-count tie-break). > 0 gates on z = dJ / SE(dJ) from the paired bootstrap, plus
#  an SE == 0 clause admitting pure structural simplifications.
# ==========================================================================

datasetType   = "MMLU_PRO"

models        = [
    "gpt-4o-2024-08-06",
    "claude-3-5-sonnet-20241022",
    "gemini-1.5-pro-002",
    "deepseek-chat-v2_5",
    "Meta-Llama-3_1-70B-Instruct",
    "Qwen1.5-72B-Chat",
    "gpt-4o-mini",
    "claude-3-5-haiku-20241022",
    "Mixtral-8x7B-Instruct-v0.1",
    "c4ai-command-r-v01",
    "Qwen1.5-14B-Chat",
    "Meta-Llama-3_1-8B-Instruct",
    "gemini-1.5-flash-002",
    "Llama-2-70b-hf",
    "Llama-2-13b-hf",
    "Meta-Llama-3-70B-Instruct"
]

category      = ""      # "" = all 14 MMLU-Pro domains (empty = no category filter)
queryLimit    = 0       # 0 = no cap; use the full corpus
outputDir     = "experiment_results/zgate/tau_s137"
testRatio     = 0.3     # frozen 70/30 stratified split, identical across seeds
seed          = 137
splitSeed     = 42   # FIXED split across every arm and seed: isolates algorithmic

runPipeline        = true
runBenchmark       = false
runTrickle         = true          # produces the ECE/routing metrics
runBaselines       = false        # gate comparison only
enableFinalMetrics = true          # REQUIRED — produces the reported metrics
enableLabeling     = false         # see header: off to protect the run, not a behaviour change
judgeInduction     = false         # judges are induced in the arena step

dagMode = "DAG_MAX"      # NOT TREE_BASELINE: that also disables residualRouting,

maxDepth              = 8      # max taxonomy depth (caps runaway recursion)
minClusterSize        = 30     # targets >=12 held-out top-1 per leaf for the arena
proposalSeparationBar = 0.025  # between the isotropic (0.021) and within-domain (0.068) nulls
tau                   = 1e-6
acceptanceZ           = 0.0    # 0 = legacy tau gate (baseline arm); >0 = dJ > z*SE(dJ)

membershipFloor       = 0.25   # min share of a query's own normalized membership for a leaf to count
routingBeamGamma      = 0.2
descentMargin         = 0.12

effectiveSupportFloor = 2.0    # min effective (soft) support for a node to be retained
defaultKappaPrior     = 10.0   # NiW prior concentration when a node has too few points

numIterations         = 50     # max evolution passes
maxLeafAssignments    = 5      # max leaves a query may be softly assigned to at arena time

fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false  # iteration 1 keeps the bootstrap assignment intact

enableProfiling           = true


