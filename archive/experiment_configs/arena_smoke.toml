# ══════════════════════════════════════════════════════════════════════════
#  outputDir: experiment_results/arena_smoke
#  arena_smoke.toml — END-TO-END SMOKE TEST. THROWAWAY OUTPUT.
#
#  Purpose: prove the arena path executes at all. runBenchmark has been false
#  in every config in this project, so BenchmarkService, rubric induction, the
#  judge client and BtMmFitter have never run on real verdicts. RQ1, RQ2,
#  three results sections and the Discussion chapter all sit behind this path.
#
#  DO NOT REPORT ANY NUMBER FROM THIS RUN. The budget is deliberately far too
#  small for a meaningful ranking; it exists to surface integration failures.
#
#  ── Why a fresh single-domain build rather than the canonical snapshot ────
#  HeadlessBenchmarkRunner.ensureJudgePrompts throws if runBenchmark = true and
#  any leaf lacks a judgePrompt/judgeRubric, and it is invoked with a hardcoded
#  "MAIN" so the check always applies. Every snapshot produced so far was built
#  with judgeInduction = false, so none carries rubrics and all of them would
#  abort on the first leaf. This config therefore builds its own small tree
#  WITH induction enabled, which also exercises the induction path itself.
#
#  category = "Math" keeps it to ~1079 queries, so construction is quick and
#  only a handful of leaves need rubrics generated.
#
#  ── What this actually tests, in order ────────────────────────────────────
#   1. construction completes and produces a snapshot with an id
#   2. judge rubric induction runs and populates every leaf (the throw above)
#   3. held-out queries route through the frozen snapshot into per-leaf pools
#   4. the judge client reaches Azure and returns parseable verdicts
#   5. verdicts are written to ratings.db against the snapshotId
#   6. BtMmFitter converges and produces per-leaf BT scores
#   7. upward aggregation yields an anchor-level ranking
#
#  Any failure tells you which link is broken. That is the whole point.
#
#  ── Requirements ──────────────────────────────────────────────────────────
#  Needs a working Azure judge endpoint (config/application.yml, credentials
#  still unrotated) and Ollama for labeling. If the judge is unreachable this
#  will fail at step 4 — which is itself worth knowing before §5.3 is written.
# ══════════════════════════════════════════════════════════════════════════

datasetType   = "MMLU_PRO"

# Three models spanning a wide capability range, so any sane judge should
# separate them. A tie here would suggest the judge is not discriminating.
models        = [
    "gpt-4o-2024-08-06",
    "Meta-Llama-3_1-70B-Instruct",
    "Llama-2-13b-hf"
]

category      = "Math"   # single domain keeps construction and induction small
queryLimit    = 0
outputDir     = "experiment_results/arena_smoke"
testRatio     = 0.3
seed          = 42

# ── Pipeline / evaluation switches ──────────────────────────────────────────
runPipeline        = true
runBenchmark       = true          # THE POINT OF THIS RUN
runTrickle         = true
runBaselines       = false
enableFinalMetrics = false         # skip the expensive metric suite
enableLabeling     = true          # rubric quality depends on real leaf labels
judgeInduction     = true          # REQUIRED, see header

# Only MAIN. The default list also runs ORACLE, GENERIC_JUDGE and
# RANDOM_SCHEDULER, which would triple the judge calls for no smoke-test value.
conditions         = ["MAIN"]

# ── Arena budget: deliberately tiny ─────────────────────────────────────────
questionsPerRound  = 4
confidenceGate     = 0.65
parallelism        = 4
reservedOnly       = true

# ── Construction mode ───────────────────────────────────────────────────────
dagMode = "DAG_MAX"

# ── Formalism parameters (canonical values) ─────────────────────────────────
maxDepth              = 8
minClusterSize        = 30
proposalSeparationBar = 0.025
tau                   = 1e-6
acceptanceZ           = 0.0
enableRefitGate       = false

membershipFloor       = 0.25
routingBeamGamma      = 0.2
descentMargin         = 0.12

effectiveSupportFloor = 2.0
defaultKappaPrior     = 10.0

numIterations         = 50
maxLeafAssignments    = 5

fusionSimilarityThreshold = 0.90
enableGtWarmStart         = false

enableProfiling           = true
